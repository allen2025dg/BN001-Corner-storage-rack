<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吧台冰箱架 · 3D展示</title>

    <!-- 引入 qrcode 库（用于生成二维码） -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Roboto', 'Noto Sans SC', sans-serif; }
        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.3);
            transition: 0.2s;
        }
        .back-home:hover {
            background: white;
            color: black;
        }
        /* 右侧面板样式 */
        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 200;
            color: #333;
            border: 1px solid rgba(0,0,0,0.1);
            font-size: 14px;
        }
        .control-panel h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: 500;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        .control-item {
            margin-bottom: 15px;
        }
        .control-item label {
            display: block;
            font-weight: 500;
            margin-bottom: 5px;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 6px 12px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }
        .btn.active {
            background: #cc8b4d;
            color: white;
            border-color: #b36b2e;
        }
        .btn:hover {
            background: #e0e0e0;
        }
        .btn.active:hover {
            background: #b87a3a;
        }
        .speed-slider {
            width: 100%;
            margin: 5px 0;
        }
        .lang-toggle {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .lang-btn {
            flex: 1;
            padding: 8px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            text-align: center;
        }
        .lang-btn.active {
            background: #cc8b4d;
            color: white;
        }
        .share-section {
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .share-url {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        .share-url input {
            flex: 1;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
        }
        .share-url button {
            padding: 6px 12px;
            background: #0078d7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .qr-code {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-code img {
            max-width: 100%;
            max-height: 100%;
        }
        /* 加载LOGO */
        #logo-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.7);
            padding: 20px 40px;
            border-radius: 10px;
            color: white;
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 2px;
        }
        #logo-container.hidden {
            display: none;
        }
        /* 进度条（可选） */
        #progress-container {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            background: rgba(0,0,0,0.8);
            color: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            z-index: 1000;
            display: none;
        }
        #progress-bar {
            width: 0%;
            height: 20px;
            background-color: #00ff00;
            border-radius: 10px;
            transition: width 0.2s;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
  <script type="module" crossorigin src="/assets/three-vendor-Dk7gV2UV.js"></script>
  <script type="module" crossorigin src="/assets/main-B7IHBxsP.js"></script>
</head>
<body>
    <a href="index.html" class="back-home">← 返回列表</a>

    <!-- 加载LOGO -->
    <div id="logo-container">
        <div>榫卯·家</div>
        <div style="font-size: 14px; margin-top: 10px;">加载中...</div>
    </div>

    <!-- 进度条（可选） -->
    <div id="progress-container">
        <div style="margin-bottom: 10px;">加载模型中...</div>
        <div style="width:100%; height:20px; background:#444; border-radius:10px;">
            <div id="progress-bar"></div>
        </div>
        <div id="progress-text">0%</div>
    </div>

    <!-- 右侧控制面板 -->
    <div class="control-panel">
        <h3 id="product-title">转角收纳架</h3>
        
        <!-- 中英文切换 -->
        <div class="lang-toggle">
            <button id="lang-zh" class="lang-btn active">中文</button>
            <button id="lang-en" class="lang-btn">English</button>
        </div>

        <!-- 款式选择 -->
        <div class="control-item">
            <label id="style-label">款式</label>
            <div class="btn-group">
                <button id="style1" class="btn active">原木色</button>
                <button id="style2" class="btn">黑色</button>
                <button id="style3" class="btn">胡桃木</button>
            </div>
        </div>

        <!-- 自动旋转控制 -->
        <div class="control-item">
            <label id="rotate-label">自动旋转</label>
            <div class="btn-group">
                <button id="rotate-on" class="btn active">开启</button>
                <button id="rotate-off" class="btn">关闭</button>
            </div>
            <div style="margin-top: 8px;">
                <span id="speed-label">速度</span>
                <input type="range" id="rotate-speed" class="speed-slider" min="0.5" max="5.0" step="0.1" value="1.0">
                <span id="speed-value">1.0</span>
            </div>
        </div>

        <!-- 分享功能 -->
        <div class="share-section">
            <label id="share-label">分享</label>
            <div class="share-url">
                <input type="text" id="page-url" readonly value="https://dovetailai.cn/product1.html">
                <button id="copy-url">复制</button>
            </div>
            <div class="qr-code" id="qr-code"></div>
        </div>
    </div>

    <script>
        window.MODEL_URL = 'assets/models/p2.glb';  // 当前产品模型
    </script>
</body>
</html>
