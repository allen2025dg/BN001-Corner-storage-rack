<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>咖啡胶囊架 · 3D展示</title>
    <link rel="stylesheet" href="/assets/css/product.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
</head>
<body>
    <a href="index.html" class="back-home">← 返回列表</a>

    <div class="control-panel">
        <h3 id="product-title">咖啡胶囊架</h3>
        <div class="lang-toggle">
            <button id="lang-zh" class="lang-btn active">中文</button>
            <button id="lang-en" class="lang-btn">English</button>
        </div>
        <div class="control-item">
            <label id="style-label">款式</label>
            <div class="btn-group">
                <button id="style1" class="btn active">原木色</button>
                <button id="style2" class="btn">黑色</button>
                <button id="style3" class="btn">胡桃木</button>
            </div>
        </div>
        <div class="control-item">
            <label id="rotate-label">自动旋转</label>
            <div class="btn-group">
                <button id="rotate-on" class="btn active">开启</button>
                <button id="rotate-off" class="btn">关闭</button>
            </div>
            <div style="margin-top: 8px;">
                <span id="speed-label">速度</span>
                <input type="range" id="rotate-speed" class="speed-slider" min="0.5" max="5.0" step="0.1" value="1.0">
                <span id="speed-value">1.0</span>
            </div>
        </div>
        <div class="share-section">
            <label id="share-label">分享</label>
            <div class="share-url">
                <input type="text" id="page-url" readonly value="https://dovetailai.cn/product4.html">
                <button id="copy-url">复制</button>
            </div>
            <div class="qr-code" id="qr-code"></div>
        </div>
    </div>

    <script>
        window.PRODUCT_NAME_ZH = '咖啡胶囊架';
        window.PRODUCT_NAME_EN = 'Coffee Capsule Rack';
        window.MODEL_URL = 'assets/models/p4.glb';
    </script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
